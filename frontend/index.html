<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Handwriting / diary fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Shantell+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Arush Ugal — Backend Software Engineer</title>
    <meta
      name="description"
      content="Arush Ugal is a backend software engineer in Tempe, AZ specializing in REST API design, distributed systems, and high-throughput, low-latency backend infrastructure for payment systems."
    />
    <meta name="author" content="Arush Ugal" />
    <link rel="canonical" href="https://arushugal.dev/" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arush Ugal — Backend Software Engineer" />
    <meta
      property="og:description"
      content="Backend software engineer specializing in REST APIs, distributed systems, and high-throughput backend infrastructure for payment systems."
    />
    <meta property="og:image" content="https://arushugal.dev/og-image.png" />
    <meta property="og:url" content="https://arushugal.dev/" />
    <meta property="og:site_name" content="Arush Ugal" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arush Ugal — Backend Software Engineer" />
    <meta
      name="twitter:description"
      content="Backend software engineer specializing in REST APIs, distributed systems, and high-throughput backend infrastructure."
    />
    <meta name="twitter:image" content="https://arushugal.dev/og-image.png" />

    <!-- Prevent theme flash: apply persisted/system theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
